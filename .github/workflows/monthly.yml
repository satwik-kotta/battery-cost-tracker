name: monthly-refresh
on:
  schedule: [{cron: "0 9 12 * *"}]     # the IMF publishes around the second week of each month
  workflow_dispatch:
  push:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m batterycost.run --refresh
      - run: python -m batterycost.optimize
      - run: python dashboard/build_dashboard.py
      - uses: actions/upload-artifact@v4
        with: {name: outputs, path: outputs}
